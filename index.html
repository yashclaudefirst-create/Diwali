<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0830">
<title>Happy Diwali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DIWALI SITE — design tokens
   ========================================================= */
:root{
  --night:#0b0830;
  --indigo:#1a1250;
  --indigo-2:#2a1a6e;
  --gold:#ffc94d;
  --gold-soft:#ffe3a0;
  --saffron:#ff9933;
  --magenta:#e6368f;
  --teal:#2ee6c8;
  --ink:#fff7e6;
  --glass:rgba(255,255,255,.07);
  --glass-border:rgba(255,214,102,.28);
  --ease:cubic-bezier(.22,.8,.24,1);
  --serif:'Playfair Display','Tiro Devanagari Hindi',Georgia,serif;
  --deva:'Tiro Devanagari Hindi','Playfair Display',serif;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--night)}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.6;
  background:linear-gradient(180deg,#07051f 0%,var(--night) 30%,var(--indigo) 70%,#2b1257 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Global overlays ------------------------------------------------ */
#warm{ /* warm light that spreads as diyas are lit (opacity driven by JS) */
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:
    radial-gradient(ellipse 120% 70% at 50% 105%,rgba(255,153,51,.55),transparent 65%),
    radial-gradient(ellipse 80% 40% at 50% 100%,rgba(255,201,77,.35),transparent 70%);
  transition:opacity 1.2s var(--ease);
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
main,footer{position:relative;z-index:2}

/* Music toggle --------------------------------------------------- */
#music{
  position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:10;
  padding:9px 14px;border-radius:999px;font-size:13px;letter-spacing:.02em;
  background:var(--glass);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 18px rgba(255,190,70,.18);
}
#music[aria-pressed="true"]{box-shadow:0 0 22px rgba(255,190,70,.55);color:var(--gold-soft)}

/* =========================================================
   1. HERO
   ========================================================= */
.hero{
  position:relative;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:72px 20px 64px;overflow:hidden;
}
.stars{position:absolute;inset:0;pointer-events:none}
.star{
  position:absolute;border-radius:50%;background:#fff;
  box-shadow:0 0 6px 1px rgba(255,255,255,.7);
  animation:twinkle var(--t,3s) ease-in-out var(--dl,0s) infinite;
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}

.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.fade{opacity:0;transform:translateY(18px);animation:fadeUp 1.4s var(--ease) forwards}
.fade.d1{animation-delay:.2s}.fade.d2{animation-delay:.7s}.fade.d3{animation-delay:1.2s}.fade.d4{animation-delay:1.7s}
@keyframes fadeUp{to{opacity:1;transform:none}}

.deva{
  font-family:var(--deva);font-size:clamp(26px,8vw,40px);color:var(--saffron);
  text-shadow:0 0 18px rgba(255,153,51,.7),0 0 40px rgba(255,153,51,.35);
}
h1{
  font-family:var(--serif);font-weight:700;line-height:1.05;
  font-size:clamp(46px,15vw,84px);margin:6px 0 10px;
  background:linear-gradient(180deg,#fff2c2,var(--gold) 55%,var(--saffron));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,190,70,.55));
}
.sub{font-weight:300;font-size:clamp(15px,4.2vw,18px);color:var(--gold-soft);max-width:30ch;text-shadow:0 0 14px rgba(255,201,77,.4)}
.sub b{font-weight:500;color:#fff}

/* Diya (shared by hero + row) */
.diya-svg{width:100%;height:auto;display:block;overflow:visible}
.flame-wrap{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s var(--ease),opacity .7s var(--ease)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .9s ease-in-out infinite}
@keyframes flicker{
  0%,100%{transform:scale(1,1) rotate(-1deg)}
  22%{transform:scale(.93,1.07) rotate(1.6deg)}
  50%{transform:scale(1.05,.95) rotate(-1.6deg)}
  76%{transform:scale(.97,1.05) rotate(1deg)}
}
.hero-diya{position:relative;width:min(58vw,230px);margin:28px 0 8px}
.halo{
  position:absolute;left:50%;top:-6%;width:170%;aspect-ratio:1;translate:-50% -30%;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,90,.55) 0%,rgba(255,153,51,.25) 32%,transparent 66%);
  animation:glow 2.4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.75;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}

.scroll-cue{margin-top:26px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-soft);opacity:.75}
.scroll-cue i{display:block;width:1px;height:34px;margin:8px auto 0;background:linear-gradient(var(--gold),transparent);animation:cue 1.8s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* =========================================================
   Sections + glass cards
   ========================================================= */
section.block{max-width:560px;margin:0 auto;padding:68px 18px}
h2{
  font-family:var(--serif);font-weight:700;font-size:clamp(28px,8vw,38px);text-align:center;
  color:var(--gold);text-shadow:0 0 22px rgba(255,201,77,.55);margin-bottom:8px;
}
.lead{text-align:center;font-weight:300;color:var(--gold-soft);margin-bottom:26px;font-size:15px}
.card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:24px;padding:24px 20px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 10px 40px rgba(0,0,0,.35),0 0 32px rgba(255,180,60,.12),inset 0 1px 0 rgba(255,255,255,.12);
}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* 2. Fireworks prompt */
.fw-card{text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.pulse{display:inline-block;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.btn{
  padding:13px 26px;border-radius:999px;font-weight:500;font-size:15px;letter-spacing:.02em;color:#2a0f05;
  background:linear-gradient(135deg,var(--gold),var(--saffron));
  box-shadow:0 0 22px rgba(255,170,50,.55),0 6px 18px rgba(0,0,0,.3);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.btn:active{transform:scale(.96)}
.btn:focus-visible,#music:focus-visible,.diya:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* 3. Diya row */
.diya-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;justify-items:center;padding:10px 0}
.diya{position:relative;width:100%;max-width:78px;padding:0;border-radius:12px;transition:transform .3s var(--ease)}
.diya:active{transform:scale(.92)}
.diya .flame-wrap{opacity:0;transform:scale(.15)}
.diya.lit .flame-wrap{opacity:1;transform:scale(1)}
.diya .halo{width:260%;opacity:0;animation:none;transition:opacity .8s var(--ease)}
.diya.lit .halo{opacity:1;animation:glow 2.4s ease-in-out infinite}
.diya-count{text-align:center;margin-top:14px;font-size:13px;color:var(--gold-soft);letter-spacing:.08em}

/* 4. Rangoli */
.rangoli-wrap{display:flex;justify-content:center}
#rangoli{width:min(86vw,360px);height:auto;overflow:visible;filter:drop-shadow(0 0 10px rgba(255,170,60,.35))}
#rangoli.spin{animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rg *{
  fill:var(--c);fill-opacity:0;stroke:var(--c);stroke-width:2;stroke-linecap:round;
  stroke-dasharray:1 1;stroke-dashoffset:1;
}
.rg.draw *{animation:draw 2.2s var(--d) ease-in-out forwards,fillin 1.4s calc(var(--d) + 1.8s) ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:.2}}

/* 5. Wishes */
.type{min-height:7.5em;font-family:var(--serif);font-style:italic;font-size:clamp(18px,5vw,22px);line-height:1.65;color:#fff;text-shadow:0 0 16px rgba(255,201,77,.35)}
.caret{display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-.15em;background:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wish-actions{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:22px}
.wish-out{
  min-height:3.6em;text-align:center;font-size:16px;color:var(--gold-soft);
  opacity:0;transform:translateY(10px);transition:opacity .7s var(--ease),transform .7s var(--ease);
}
.wish-out.show{opacity:1;transform:none}
.wish-out small{display:block;margin-top:6px;opacity:.6;font-size:12px}

/* 6. Footer */
footer{position:relative;overflow:hidden;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 70px}
footer .love{font-family:var(--serif);font-style:italic;font-size:clamp(26px,8vw,38px);color:var(--gold);text-shadow:0 0 24px rgba(255,201,77,.6);position:relative;z-index:2}
footer .tiny{margin-top:10px;font-size:13px;color:var(--gold-soft);opacity:.75;position:relative;z-index:2}
.petals{position:absolute;inset:0;pointer-events:none}
.petal{
  position:absolute;top:-30px;left:var(--x);width:var(--s);height:calc(var(--s) * 1.35);
  border-radius:80% 0 80% 0;opacity:.0;
  background:radial-gradient(circle at 30% 30%,#ffd35a,var(--saffron) 65%,#d9560a);
  box-shadow:0 0 10px rgba(255,160,40,.5);
  animation:fall var(--dur) linear var(--dl) infinite paused;
}
.petals.on .petal{animation-play-state:running}
@keyframes fall{
  0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}
  10%{opacity:.95}
  50%{transform:translate3d(var(--dx),220px,0) rotate(240deg)}
  90%{opacity:.9}
  100%{opacity:0;transform:translate3d(calc(var(--dx) * -.6),440px,0) rotate(520deg)}
}

/* =========================================================
   Accessibility: respect reduced motion
   ========================================================= */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
  .fade,.reveal{opacity:1;transform:none}
  .star{opacity:.7}
  .rg *{stroke-dashoffset:0;fill-opacity:.2}
  .diya.lit .halo{opacity:1}
  .petal{opacity:.8;top:auto;bottom:20px}
  .caret{display:none}
}
</style>
</head>

<body>

<!-- Shared gradient defs for every diya (referenced by id) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="gBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9622a"/><stop offset="1" stop-color="#6f240f"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff8a2a"/>
    </linearGradient>
  </defs>
</svg>

<div id="warm" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="music" type="button" aria-pressed="false" aria-label="Toggle ambient music">♪ Music off</button>

<main>
  <!-- ============ 1. HERO ============ -->
  <header class="hero" id="top">
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="deva fade d1">शुभ दीपावली</p>
      <h1 class="fade d2">Happy Diwali</h1>
      <p class="sub fade d3" id="heroSub"></p>
      <div class="hero-diya fade d4" id="heroDiya" aria-label="A glowing diya"></div>
      <div class="scroll-cue fade d4">scroll<i></i></div>
    </div>
  </header>

  <!-- ============ 2. FIREWORKS ============ -->
  <section class="block" id="fireworks">
    <h2 class="reveal">Light up the sky</h2>
    <p class="lead reveal">Tap anywhere on the screen to burst a firework.</p>
    <div class="card fw-card reveal">
      <div class="pulse" style="font-size:44px" aria-hidden="true">🎆</div>
      <button class="btn" id="finale" type="button">Launch a finale</button>
    </div>
  </section>

  <!-- ============ 3. DIYA ROW ============ -->
  <section class="block" id="diyas">
    <h2 class="reveal">Light the diyas</h2>
    <p class="lead reveal">Watch them glow one by one — or tap to light your own.</p>
    <div class="card reveal">
      <div class="diya-row" id="diyaRow"></div>
      <p class="diya-count" id="diyaCount">0 of 7 lit</p>
    </div>
  </section>

  <!-- ============ 4. RANGOLI ============ -->
  <section class="block" id="rangoliSec">
    <h2 class="reveal">Rangoli</h2>
    <p class="lead reveal">Colour, drawn by light.</p>
    <div class="card rangoli-wrap reveal">
      <svg id="rangoli" viewBox="-190 -190 380 380" role="img" aria-label="Animated rangoli pattern"><g class="rg" id="rg"></g></svg>
    </div>
  </section>

  <!-- ============ 5. WISHES ============ -->
  <section class="block" id="wishes">
    <h2 class="reveal">Our wishes</h2>
    <div class="card reveal">
      <p class="type" id="typed" aria-live="polite"></p>
    </div>
    <div class="wish-actions reveal">
      <button class="btn" id="wishBtn" type="button">🪔 Light a diya for someone</button>
      <p class="wish-out" id="wishOut" aria-live="polite"></p>
    </div>
  </section>
</main>

<!-- ============ 6. FOOTER ============ -->
<footer>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <p class="love">With love, <span id="fromName"></span></p>
  <p class="tiny">Happy Diwali 🪔 May your year glow.</p>
</footer>

<script>
(() => {
  'use strict';

  /* =========================================================
     CONFIG & HELPERS
     ========================================================= */
  const DEFAULT_SENDER = 'Yash';         // shown in the footer unless ?from=Name is given
  const DEFAULT_GREETING = 'you and yours';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  /* ---------- Personalisation: ?to=Name&from=Name ----------
     Names are written with textContent only, so they can't inject HTML. */
  const params = new URLSearchParams(location.search);
  const clean = (v) => (v || '').replace(/[<>]/g, '').trim().slice(0, 32);
  const toName = clean(params.get('to'));
  const fromName = clean(params.get('from')) || DEFAULT_SENDER;

  const sub = $('#heroSub');
  sub.append('Wishing ');
  const who = document.createElement('b');
  who.textContent = toName || DEFAULT_GREETING;
  sub.append(who, ' a festival of lights, joy & sweetness.');
  $('#fromName').textContent = fromName;
  if (toName) document.title = 'Happy Diwali, ' + toName;

  /* ---------- Shared diya artwork ---------- */
  const DIYA_SVG = `
  <svg class="diya-svg" viewBox="0 0 200 170" aria-hidden="true">
    <g class="flame-wrap"><g class="flame">
      <path d="M100 4C120 32 126 54 100 72C74 54 80 32 100 4Z" fill="url(#gFlame)"/>
      <path d="M100 32C110 46 112 58 100 68C88 58 90 46 100 32Z" fill="#fff6c8" opacity=".9"/>
    </g></g>
    <rect x="96" y="66" width="8" height="15" rx="3" fill="#3a1d0f"/>
    <path d="M14 84Q100 180 186 84Q100 98 14 84Z" fill="url(#gBowl)" stroke="#ffd66b" stroke-width="2"/>
    <ellipse cx="100" cy="84" rx="86" ry="9" fill="url(#gRim)"/>
    <path d="M52 112Q100 140 148 112" fill="none" stroke="#ffd66b" stroke-width="2" opacity=".6" stroke-dasharray="3 6"/>
  </svg>`;

  /* =========================================================
     1. HERO — twinkling stars + central diya
     ========================================================= */
  (function buildStars() {
    const box = $('#stars');
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('span');
      const size = rand(1, 3);
      s.className = 'star';
      s.style.cssText = `left:${rand(0, 100)}%;top:${rand(0, 100)}%;width:${size}px;height:${size}px;` +
        `--t:${rand(2, 5).toFixed(1)}s;--dl:${rand(0, 4).toFixed(1)}s`;
      frag.appendChild(s);
    }
    box.appendChild(frag);
  })();

  // Hero diya is always lit: halo + flame
  $('#heroDiya').innerHTML = '<div class="halo"></div>' + DIYA_SVG;

  /* =========================================================
     2. FIREWORKS — canvas, tap bursts + auto bursts
     Particles use gravity, drag, fade-out and an additive
     ("lighter") glow. The loop only runs while particles exist.
     ========================================================= */
  const canvas = $('#fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const PALETTE = [
    [255, 201, 77], [255, 153, 51], [230, 54, 143],
    [255, 120, 200], [46, 230, 200], [255, 255, 255], [140, 160, 255]
  ];
  let particles = [];
  let rafId = 0, lastT = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function burst(x, y, count = 72) {
    if (reduceMotion) return;                    // no fireworks for reduced-motion users
    const a = PALETTE[(Math.random() * PALETTE.length) | 0];
    const b = PALETTE[(Math.random() * PALETTE.length) | 0];
    const ring = Math.random() < 0.4;            // some bursts form a clean ring
    for (let i = 0; i < count; i++) {
      const ang = (i / count) * TAU + rand(-0.05, 0.05);
      const sp = ring ? rand(3.6, 4.2) : rand(1.2, 5);
      particles.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 1, decay: rand(0.008, 0.017), size: rand(1.2, 2.6),
        c: Math.random() < 0.7 ? a : b
      });
    }
    if (particles.length > 1100) particles.splice(0, particles.length - 1100);
    if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(tick); }
  }

  function tick(t) {
    const dt = Math.min((t - lastT) / 16.67, 3);  // normalise to 60fps steps
    lastT = t;

    // fade previous frame -> glowing trails
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    const drag = Math.pow(0.985, dt);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx *= drag; p.vy = p.vy * drag + 0.05 * dt;   // gravity
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const al = p.life * p.life;
      const [r, g, b] = p.c;
      ctx.fillStyle = `rgba(${r},${g},${b},${al * 0.16})`;     // soft glow
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 4, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(${r},${g},${b},${al})`;            // bright core
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }

    if (particles.length) rafId = requestAnimationFrame(tick);
    else { rafId = 0; ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); }
  }

  // Tap / click anywhere
  addEventListener('pointerdown', (e) => burst(e.clientX, e.clientY));

  // Auto-bursts every few seconds (skipped when the tab is hidden)
  function autoBurst() {
    if (!document.hidden) burst(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * 0.5), (rand(55, 90)) | 0);
    setTimeout(autoBurst, rand(2200, 4200));
  }
  if (!reduceMotion) setTimeout(autoBurst, 1400);

  // Finale button: a quick volley
  $('#finale').addEventListener('click', () => {
    for (let i = 0; i < 7; i++) {
      setTimeout(() => burst(rand(W * 0.1, W * 0.9), rand(H * 0.1, H * 0.55), 80), i * 220);
    }
  });

  /* =========================================================
     3. DIYA ROW — light on scroll (sequentially) or tap
     Warm light overlay grows with the number of lit diyas.
     ========================================================= */
  const row = $('#diyaRow');
  const warm = $('#warm');
  const countEl = $('#diyaCount');
  const TOTAL = 7;
  const diyas = [];

  for (let i = 0; i < TOTAL; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'diya';
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Diya ' + (i + 1));
    b.innerHTML = '<div class="halo"></div>' + DIYA_SVG;
    b.addEventListener('click', (e) => {
      setLit(b, !b.classList.contains('lit'));
      if (b.classList.contains('lit')) {
        const r = b.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top, 26);
      }
      e.stopPropagation();   // avoid a second burst from the global tap
    });
    row.appendChild(b);
    diyas.push(b);
  }

  function setLit(el, on) {
    el.classList.toggle('lit', on);
    el.setAttribute('aria-pressed', String(on));
    const n = diyas.filter((d) => d.classList.contains('lit')).length;
    countEl.textContent = n + ' of ' + TOTAL + ' lit';
    warm.style.opacity = (n / TOTAL * 0.9).toFixed(2);     // warm light spreads across the page
  }

  let diyasStarted = false;
  function lightSequence() {
    if (diyasStarted) return;
    diyasStarted = true;
    diyas.forEach((d, i) => setTimeout(() => setLit(d, true), reduceMotion ? 0 : i * 420));
  }

  /* =========================================================
     4. RANGOLI — SVG built in JS, strokes draw themselves
     ========================================================= */
  const NS = 'http://www.w3.org/2000/svg';
  const rg = $('#rg');
  let delay = 0;

  function addShape(tag, attrs, color, step = 0.18) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    el.setAttribute('pathLength', '1');          // lets every shape share one dash animation
    el.style.cssText = `--c:${color};--d:${delay.toFixed(2)}s`;
    delay += step;
    rg.appendChild(el);
    return el;
  }

  (function buildRangoli() {
    // outer rings
    addShape('circle', { cx: 0, cy: 0, r: 178 }, '#ffc94d', 0.3);
    addShape('circle', { cx: 0, cy: 0, r: 168 }, '#ff9933', 0.3);

    // 12 big petals (magenta / saffron alternating)
    const big = 'M0 -62C26 -98 26 -140 0 -164C-26 -140 -26 -98 0 -62Z';
    for (let i = 0; i < 12; i++) {
      addShape('path', { d: big, transform: `rotate(${i * 30})` }, i % 2 ? '#ff9933' : '#e6368f', 0.12);
    }

    // ring of dots
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU, r = 124;
      addShape('circle', { cx: (Math.cos(a) * r).toFixed(2), cy: (Math.sin(a) * r).toFixed(2), r: 4 }, '#2ee6c8', 0.05);
    }

    // 16-point star
    let d = '';
    for (let i = 0; i < 32; i++) {
      const a = (i / 32) * TAU - Math.PI / 2, r = i % 2 ? 52 : 98;
      d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(2) + ' ' + (Math.sin(a) * r).toFixed(2);
    }
    addShape('path', { d: d + 'Z' }, '#ffc94d', 0.5);

    // 8 inner petals
    const mid = 'M0 -26C18 -48 18 -72 0 -90C-18 -72 -18 -48 0 -26Z';
    for (let i = 0; i < 8; i++) {
      addShape('path', { d: mid, transform: `rotate(${i * 45 + 22.5})` }, i % 2 ? '#e6368f' : '#2ee6c8', 0.12);
    }

    // lotus centre
    const lot = 'M0 -8C10 -18 10 -30 0 -38C-10 -30 -10 -18 0 -8Z';
    for (let i = 0; i < 6; i++) addShape('path', { d: lot, transform: `rotate(${i * 60})` }, '#ffc94d', 0.1);
    addShape('circle', { cx: 0, cy: 0, r: 7 }, '#fff2c2', 0.2);
  })();

  let rangoliDrawn = false;
  function drawRangoli() {
    if (rangoliDrawn) return;
    rangoliDrawn = true;
    rg.classList.add('draw');
    // after the drawing finishes, let the whole pattern slowly turn
    if (!reduceMotion) setTimeout(() => $('#rangoli').classList.add('spin'), (delay + 4) * 1000);
  }

  /* =========================================================
     5. WISHES — typing effect + random wish button
     ========================================================= */
  const greetName = toName ? toName : 'dear one';
  const MESSAGE =
    `Dear ${greetName}, may this Diwali fill your home with warm light, your heart with joy, ` +
    `and your days with sweet beginnings. May every diya you light chase away a worry, ` +
    `and may the year ahead glow as bright as tonight. Shubh Deepavali!`;
  const typedEl = $('#typed');
  const caret = document.createElement('span');
  caret.className = 'caret';
  let typingStarted = false;

  function startTyping() {
    if (typingStarted) return;
    typingStarted = true;
    if (reduceMotion) { typedEl.textContent = MESSAGE; return; }
    const textNode = document.createTextNode('');
    typedEl.append(textNode, caret);
    let shown = 0, last = performance.now();
    const speed = 38;                              // ms per character
    (function step(t) {
      if (t - last >= speed) {
        const n = Math.max(1, Math.floor((t - last) / speed));
        shown = Math.min(MESSAGE.length, shown + n);
        textNode.nodeValue = MESSAGE.slice(0, shown);
        last = t;
      }
      if (shown < MESSAGE.length) requestAnimationFrame(step);
    })(last);
  }

  const WISHES = [
    'May their home overflow with light, laughter and sweets.',
    'May every worry fade like smoke from a lit diya.',
    'May Lakshmi bless them with joy, health and good fortune.',
    'May this Diwali bring them one wish they have been waiting for.',
    'May old hurts heal and new friendships glow.',
    'May their path be lit, even on the darkest nights.',
    'May they feel as loved as they make others feel.',
    'May the sparkle in their eyes outshine every firework.',
    'May the year ahead be full of small, golden moments.',
    'May peace, prosperity and plenty find their doorstep.'
  ];
  const wishOut = $('#wishOut');
  let lastWish = -1, wishCount = 0;

  $('#wishBtn').addEventListener('click', (e) => {
    let i;
    do { i = (Math.random() * WISHES.length) | 0; } while (i === lastWish);
    lastWish = i; wishCount++;
    wishOut.classList.remove('show');
    // restart the fade after a frame so repeated taps re-animate
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wishOut.textContent = '🪔 ' + WISHES[i];
      const small = document.createElement('small');
      small.textContent = wishCount === 1 ? 'A diya is lit for someone you love.' : wishCount + ' diyas lit for the people you love.';
      wishOut.appendChild(small);
      wishOut.classList.add('show');
    }));
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 60);
    e.stopPropagation();
  });

  /* =========================================================
     6. FOOTER — floating marigold petals
     ========================================================= */
  const petalBox = $('#petals');
  (function buildPetals() {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('span');
      p.className = 'petal';
      p.style.cssText = `--x:${rand(2, 96).toFixed(1)}%;--s:${rand(10, 18).toFixed(0)}px;` +
        `--dur:${rand(8, 14).toFixed(1)}s;--dl:-${rand(0, 12).toFixed(1)}s;--dx:${rand(-50, 50).toFixed(0)}px`;
      frag.appendChild(p);
    }
    petalBox.appendChild(frag);
  })();

  /* =========================================================
     Scroll observers — reveal cards, trigger section effects
     ========================================================= */
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      const el = en.target;
      if (el.classList.contains('reveal')) { if (en.isIntersecting) el.classList.add('in'); }
      if (el === row && en.isIntersecting) lightSequence();
      if (el === $('#rangoli') && en.isIntersecting) drawRangoli();
      if (el === typedEl && en.isIntersecting) startTyping();
      if (el === petalBox) petalBox.classList.toggle('on', en.isIntersecting);
    });
  }, { threshold: 0.25 });

  document.querySelectorAll('.reveal').forEach((n) => io.observe(n));
  [row, $('#rangoli'), typedEl, petalBox].forEach((n) => io.observe(n));

  /* =========================================================
     Ambient music — synthesised with Web Audio (no files).
     A soft tanpura-like drone + sitar/bell plucks on a
     pentatonic (Mohanam) scale. OFF by default.
     ========================================================= */
  const musicBtn = $('#music');
  let actx = null, master = null, droneNodes = [], noteTimer = 0, musicOn = false;
  const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25]; // C D E G A C D E

  function pluck(freq) {
    const t = actx.currentTime;
    const g = actx.createGain();
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    // string-like body + bell overtone
    [['triangle', 1, 1], ['sine', 2.01, 0.35], ['sine', 3.0, 0.12]].forEach(([type, mult, amp]) => {
      const o = actx.createOscillator(), og = actx.createGain();
      o.type = type; o.frequency.value = freq * mult; og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2.8);
    });
    g.connect(lp); lp.connect(master);
  }

  function scheduleNote() {
    if (!musicOn) return;
    pluck(SCALE[(Math.random() * SCALE.length) | 0]);
    noteTimer = setTimeout(scheduleNote, rand(1100, 2600));
  }

  function startMusic() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    master = actx.createGain();
    master.gain.setValueAtTime(0.0001, actx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.5, actx.currentTime + 1.5);   // gentle fade-in
    master.connect(actx.destination);
    // drone: Sa + Pa
    droneNodes = [130.81, 196.0].map((f) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.06;
      o.connect(g); g.connect(master); o.start();
      return o;
    });
    musicOn = true;
    scheduleNote();
  }

  function stopMusic() {
    musicOn = false;
    clearTimeout(noteTimer);
    const m = master, drones = droneNodes;
    m.gain.cancelScheduledValues(actx.currentTime);
    m.gain.setValueAtTime(Math.max(m.gain.value, 0.0001), actx.currentTime);
    m.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.8);       // gentle fade-out
    setTimeout(() => { drones.forEach((o) => { try { o.stop(); } catch (_) {} }); }, 900);
    droneNodes = [];
  }

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    try { musicOn ? stopMusic() : startMusic(); } catch (_) { return; }
    musicBtn.setAttribute('aria-pressed', String(musicOn));
    musicBtn.textContent = musicOn ? '♪ Music on' : '♪ Music off';
  });
})();
</script>
</body>
</html>
